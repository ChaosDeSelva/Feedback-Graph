name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:5.26-community@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
        env:
          NEO4J_AUTH: neo4j/testpassword
          # The smallest transaction-memory limits the stack runs with (docker-compose.small.yml), so the large code-map
          # tests can fail.
          NEO4J_dbms_memory_transaction_total_max: 128M
          NEO4J_db_memory_transaction_total_max: 128M
          NEO4J_db_memory_transaction_max: 32M
          NEO4J_server_memory_heap_initial__size: 512M
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 512M
        ports: ["7688:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null || exit 1"
          --health-interval 5s --health-retries 40
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: fg
          POSTGRES_PASSWORD: fg
          POSTGRES_DB: fg_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U fg -d fg_test"
          --health-interval 2s --health-retries 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the history check below reads every commit
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # A push publishes every commit: no real home folders, planning documents or private names anywhere in history.
      - run: ./scripts/check-public-history.sh HEAD
      - run: pnpm lint
      - run: pnpm typecheck
      # Verify builds even when an integration environment cannot start its sandbox.
      - run: pnpm -F @fb/ui build
      - name: Docker images build
        run: docker build --target worker -t fg-worker . && docker build --target api -t fg-api .
      - name: Allow isolated runner user namespaces on Ubuntu
        run: sudo apparmor_parser -r scripts/apparmor/feedback-graph-codex-runner
      # Every test project with coverage: unit + ui, then the contract suites once per backend (both must pass the same
      # tests), merged and held to the floor in vitest.config.ts.
      - run: pnpm test:coverage:all
        env: { FG_TEST_RUNNER_UNMASK_SYSTEM_PATHS: '1', CODEX_RUNNER_APPARMOR: feedback-graph-codex-runner, TEST_STORES: 'neo4j,postgres', NEO4J_TEST_URL: bolt://127.0.0.1:7688, TEST_PG_URL: 'postgres://fg:fg@127.0.0.1:5433/fg_test' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/coverage-summary.json, if-no-files-found: ignore }
