# FG_INSTANCE (.env): one name per install, so a second checkout never adopts this one's containers and volumes.
# Unset: feedback-graph, as before, so an existing install keeps its data. ./scripts/setup.sh picks one when needed.
name: ${FG_INSTANCE:-feedback-graph}

# No project folder is mounted here. You choose them in Settings (or PROJECTS_DIRS in .env); ./scripts/setup.sh then
# writes docker-compose.override.yml with exactly those folders, read-only, plus PROJECT_ROOTS and HOST_PROJECT_ROOTS
# (do not edit this file for it). With no folder chosen everything still starts, with no projects to read.
x-env: &env
  # Where everything is stored: neo4j (the default) or postgres. For Postgres, also start its service:
  #   STORE=postgres docker compose --profile postgres up -d
  STORE: ${STORE:-neo4j}
  # Read only when STORE=postgres. The default points at the bundled postgres service below; set DATABASE_URL to use
  # your own server instead (then the profile is not needed).
  DATABASE_URL: ${DATABASE_URL:-postgres://fg:${POSTGRES_PASSWORD:-}@postgres:5432/feedback}
  NEO4J_URL: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
  # Your home folder on the host: never suggested as a project root (Settings suggests the folders sessions ran in).
  HOST_HOME: ${HOME}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-}
  OLLAMA_REPEAT_PENALTY: ${OLLAMA_REPEAT_PENALTY:-}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-}
  # Which projects are read is chosen in the UI (Settings). INGEST_PROJECTS only seeds that choice while none has
  # been made; EXCLUDE_PROJECTS is never read, scanned or served, whatever is chosen.
  INGEST_PROJECTS: ${INGEST_PROJECTS:-}
  EXCLUDE_PROJECTS: ${EXCLUDE_PROJECTS:-}
  # Feedback Graph Cloud sync, off unless both are set: push your lessons to a team org (see README).
  # CLOUD_URL is https; plain http only to a cloud on this machine (localhost, 127.0.0.1, [::1], or
  # host.docker.internal: the host as the containers see it). CLOUD_TOKEN is a token with the sync scope. Never logged.
  CLOUD_URL: ${CLOUD_URL:-}
  CLOUD_TOKEN: ${CLOUD_TOKEN:-}
  CLOUD_LOCAL_ONLY_PROJECTS: ${CLOUD_LOCAL_ONLY_PROJECTS:-}
  # This machine's name on the cloud's sync log (inside a container the hostname is a random id). setup.sh fills it.
  CLOUD_MACHINE: ${CLOUD_MACHINE:-}
  # Minutes between automatic syncs (at least 5); empty syncs only when you press Sync now in Settings.
  SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-}
  # Narrow the synced projects (comma-separated); empty syncs every selected project.
  SYNC_PROJECTS: ${SYNC_PROJECTS:-}
  # true: proposed lessons are sent too, as suggestions for an org admin; default only approved ones.
  SYNC_SUGGESTIONS: ${SYNC_SUGGESTIONS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  neo4j:
    # 5.26 is the long-term-support line: patch updates only.
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7476}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7689}:7687"
    volumes:
      - neo4j-data:/data
    # The image's entrypoint starts as root, fixes the ownership of /data and switches to the neo4j user: it keeps only
    # the capabilities that needs, and no process in it may gain more (a setuid binary included).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    # Linux: setup.sh sets HOST_UID/HOST_GID in .env to your id -u / id -g, so the worker can write ./state and read
    # transcripts only you may read. Default 1000 (the image's node user); macOS and Windows need nothing.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true # reaps the CLI agents' child processes and forwards SIGTERM for a clean shutdown
    stop_grace_period: 30s
    # It runs as an ordinary user and spawns git and the CLI agents as that same user: no capability is needed, and no
    # process in it may gain one (a setuid binary included). Codex's own Linux sandbox sets no_new_privs itself.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Nothing in the image is written at run time: what it writes is /state, /codex and /scratch (volumes below), /tmp
    # (the heartbeat, scratch folders and repository mirrors for the agent CLIs) and $HOME=/home/fg (the agent CLIs'
    # settings), both in memory and gone at restart.
    read_only: true
    tmpfs:
      - /tmp
      - /home/fg
    environment:
      <<: *env
      TRANSCRIPTS_DIR: /transcripts
      CODEX_SESSIONS_DIR: /codex-sessions
      CLASSIFY_LLM: ${CLASSIFY_LLM:-}
      POSTMORTEM_LLM: ${POSTMORTEM_LLM:-}
      # codex-cli runs confined in the codex-runner service below when CODEX_RUNNER_URL is set (http://codex-runner:8790,
      # with --profile codex). Without it, inside this container it can read everything this container can (SECURITY.md)
      # and runs only with ALLOW_UNCONFINED_CODEX=1.
      CODEX_RUNNER_URL: ${CODEX_RUNNER_URL:-}
      CODEX_RUNNER_SCRATCH: /scratch
      ALLOW_UNCONFINED_CODEX: ${ALLOW_UNCONFINED_CODEX:-}
      SCAN_LLM: ${SCAN_LLM:-}
      DOCS_LLM: ${DOCS_LLM:-}
      # Ask: the default model of chats that pick none (empty: claude-cli, else codex-cli, else the local model).
      CHAT_LLM: ${CHAT_LLM:-}
      CODEX_HOME: /codex
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      # GitHub and Linear: a token here wins; otherwise the one pasted in Settings (INTEGRATIONS_FILE, mode 600).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional override: project-key=owner/repo pairs (each selected project's github.com remote is used otherwise).
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      GITHUB_SYNC_HOURS: ${GITHUB_SYNC_HOURS:-6}
      # Comment authors labelled bot (skipped before the classifier) or agent (kept, labelled); comma separated.
      GITHUB_BOT_LOGINS: ${GITHUB_BOT_LOGINS:-}
      GITHUB_AGENT_LOGINS: ${GITHUB_AGENT_LOGINS:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      INTEGRATION_SYNC_MINUTES: ${INTEGRATION_SYNC_MINUTES:-}
      LINK_SCAN_MINUTES: ${LINK_SCAN_MINUTES:-}
      INTEGRATIONS_FILE: /state/settings/integrations.json
      # TypeSafe Jev: set CLASSIFY_LLM=jev to classify pushback with it (classification only)
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Days to keep the text of turns nobody flagged; empty keeps everything.
      TURN_RETENTION_DAYS: ${TURN_RETENTION_DAYS:-}
      # true: Claude Code feedback memories become approved lessons on import; default false (proposed, you approve them).
      MEMORY_AUTO_APPROVE: ${MEMORY_AUTO_APPROVE:-false}
      STATE_DB: /state/worker.sqlite
      POLL_SECONDS: ${POLL_SECONDS:-30}
      # Empty = the defaults: 50 turns per cycle; files per project scale with its size (40% of the candidates, at least
      # 400, at most 4000; a number here fixes the cap for the code map and each scan run); 80000 bytes per file.
      CLASSIFY_BATCH: ${CLASSIFY_BATCH:-}
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-}
      SCAN_MAX_BYTES: ${SCAN_MAX_BYTES:-}
      # Session summaries: the model (empty = the local one; off = no summaries) and when a session is summarized.
      SUMMARY_LLM: ${SUMMARY_LLM:-}
      SUMMARY_QUIET_MINUTES: ${SUMMARY_QUIET_MINUTES:-}
      SUMMARY_MAX_DELTA_TURNS: ${SUMMARY_MAX_DELTA_TURNS:-}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-}
      SUMMARY_BACKFILL_PER_CYCLE: ${SUMMARY_BACKFILL_PER_CYCLE:-}
    volumes:
      # Claude Code session transcripts (and its memory notes); CLAUDE_PROJECTS_DIR when they are elsewhere.
      - ${CLAUDE_PROJECTS_DIR:-${HOME}/.claude/projects}:/transcripts:ro
      # Codex CLI / Desktop session transcripts. Read only for the folders you select.
      - ${CODEX_SESSIONS_DIR:-${HOME}/.codex/sessions}:/codex-sessions:ro
      # Only the Codex login, not all of ~/.codex (config, history, other sessions). Writable so token refreshes stick.
      - codex-home:/codex
      # CODEX_AUTH_FILE=~/.codex/auth.json (set by scripts/setup.sh when you use Codex); the default is an empty placeholder.
      - ${CODEX_AUTH_FILE:-./state/codex-auth.json}:/codex/auth.json
      - ./state:/state
      # Shared with codex-runner only: the per-job repository mirrors and the runner's token.
      - codex-scratch:/scratch
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      neo4j: { condition: service_healthy }
      # Only with --profile postgres; without it this dependency is skipped.
      postgres: { condition: service_healthy, required: false }
      # Only with --profile codex.
      codex-runner: { condition: service_healthy, required: false }
    restart: unless-stopped

  # Runs codex-cli where there is nothing else to read: the Codex CLI, your Codex login and the scratch volume the
  # worker writes each job's repository mirror into. No transcripts, no projects, no state, no secrets in its
  # environment. Off unless you ask for it:
  #   COMPOSE_PROFILES=codex and CODEX_RUNNER_URL=http://codex-runner:8790 in .env, then docker compose up -d
  # Not published on any host port; the worker reaches it on the compose network with a token the runner writes into
  # the scratch volume at startup.
  codex-runner:
    build: { context: ., target: codex-runner }
    profiles: ["codex"]
    # The same uid as the worker: the runner's token (mode 0600) and the worker's mirrors (mode 0700) are each readable
    # only by their owner.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true # codex runs in its own process group; a timeout kills the group, and init reaps what is left
    environment:
      CODEX_HOME: /codex
      RUNNER_SCRATCH: /scratch
      RUNNER_PORT: "8790"
      HOME: /tmp
    volumes:
      - codex-scratch:/scratch
      # Its own CODEX_HOME (not the worker's), with only the login file from the host in it.
      - codex-runner-home:/codex
      - ${CODEX_AUTH_FILE:-./state/codex-auth.json}:/codex/auth.json
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Codex's own read-only sandbox (bubblewrap: no writes, no network for the commands codex runs) needs an
      # unprivileged namespaces. Keep a deny-by-default Docker-derived allowlist with only the required namespace
      # exceptions, rather than disabling syscall filtering. See scripts/seccomp/README.md and SECURITY.md.
      - seccomp=./scripts/seccomp/codex-runner.json
      # Docker's default AppArmor profile denies mount propagation changes inside bwrap's new user namespace.
      # Scope this exception to the runner; its outer mount/PID namespace still hides other jobs and runner state.
      # On Ubuntu with restricted userns, load scripts/apparmor/feedback-graph-codex-runner and select its name.
      - apparmor=${CODEX_RUNNER_APPARMOR:-unconfined}
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    # An ordinary user listening on an unprivileged port: no capability is needed, and none can be gained.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # It writes only /settings (the volume below); /tmp is there, in memory, for anything a library puts there.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *env
      CHECK_LLM: ${CHECK_LLM:-}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-}
      CHECK_WAIT_SECONDS: ${CHECK_WAIT_SECONDS:-}
      # Set API_TOKEN (24+ chars, e.g. openssl rand -hex 24) before exposing the API beyond this machine.
      API_TOKEN: ${API_TOKEN:-}
      PUBLIC_HOSTS: ${PUBLIC_HOSTS:-}
      # Lets agents (the fg CLI) make the owner decisions OPERATOR_ALLOW names. Empty: only the UI can.
      FG_OPERATOR_TOKEN: ${FG_OPERATOR_TOKEN:-}
      OPERATOR_ALLOW: ${OPERATOR_ALLOW:-}
      # The address the port is published on (below); anything but loopback without API_TOKEN stops the API at start.
      API_BIND: ${API_BIND:-127.0.0.1}
      # Inside the container the server listens on every interface; the publish above decides who can reach it.
      API_LISTEN: 0.0.0.0
      # Where Settings saves the project roots you choose; ./scripts/setup.sh mounts them (they are bind mounts, so a
      # change needs that restart).
      ROOTS_FILE: /settings/project-roots.json
      # GitHub and Linear: Settings tests a token with one call and shows the account; one in .env wins and is shown
      # as "set in .env". A pasted token is saved here (mode 600) and read by the worker as /state/settings/....
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      INTEGRATIONS_FILE: /settings/integrations.json
      # The worker's file limits, so answers can say why a named file is not in the code map (over SCAN_MAX_BYTES, or
      # past the SCAN_MAX_FILES cap). Empty = the defaults.
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-}
      SCAN_MAX_BYTES: ${SCAN_MAX_BYTES:-}
    volumes:
      # Only this folder of ./state: not the worker's database or the Codex login placeholder.
      - ./state/settings:/settings
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      # Loopback only by default. API_BIND=0.0.0.0 requires API_TOKEN (the API refuses to start without it) and
      # PUBLIC_HOSTS for the names clients use.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8787}:8787"
    depends_on:
      neo4j: { condition: service_healthy }
      # Only with --profile postgres; without it this dependency is skipped.
      postgres: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # The Postgres backend (pgvector on Postgres 17), for STORE=postgres. Off unless you ask for it:
  #   STORE=postgres docker compose --profile postgres up -d
  # Back it up with pg_dump (docs/operations.md). Needs POSTGRES_PASSWORD in .env (letters and digits: it goes in a URL).
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: fg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: feedback
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fg -d feedback"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Free, fully containerised model server (CPU on macOS, GPU on Linux with the nvidia runtime).
  # Use with: docker compose --profile ollama up -d  and  OLLAMA_URL=http://ollama:11434
  ollama:
    image: ollama/ollama:0.40.2
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"

volumes:
  neo4j-data:
  postgres-data:
  ollama-models:
  codex-home:
  codex-scratch:
  codex-runner-home:
