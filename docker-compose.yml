name: feedback-graph

# Host paths. PROJECTS_DIR holds your project folders (one folder per project); FEEDBACK_TOOL_DIR is this repo,
# for the bundled examples. Both default to sensible values; set them in .env when yours differ. More than one
# projects folder: PROJECTS_DIRS in .env, then ./scripts/setup.sh writes docker-compose.override.yml (do not edit this
# file for it).
x-env: &env
  # Where everything is stored: neo4j (the default) or postgres. For Postgres, also start its service:
  #   STORE=postgres docker compose --profile postgres up -d
  STORE: ${STORE:-neo4j}
  # Read only when STORE=postgres. The default points at the bundled postgres service below; set DATABASE_URL to use
  # your own server instead (then the profile is not needed).
  DATABASE_URL: ${DATABASE_URL:-postgres://fg:${POSTGRES_PASSWORD:-}@postgres:5432/feedback}
  NEO4J_URL: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
  PROJECT_ROOTS: /vibe,/examples
  HOST_PROJECT_ROOTS: ${PROJECTS_DIR:-${HOME}/code},${FEEDBACK_TOOL_DIR:-${PWD}}/examples
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  # Which projects are read is chosen in the UI (Settings). INGEST_PROJECTS only seeds that choice on the first
  # start; EXCLUDE_PROJECTS is never read, scanned or served, whatever is chosen.
  INGEST_PROJECTS: ${INGEST_PROJECTS:-}
  EXCLUDE_PROJECTS: ${EXCLUDE_PROJECTS:-}
  # Feedback Graph Cloud sync, off unless both are set: push your lessons to a team org (see README).
  # CLOUD_URL is https (plain http only to localhost); CLOUD_TOKEN is a token with the sync scope. Never logged.
  CLOUD_URL: ${CLOUD_URL:-}
  CLOUD_TOKEN: ${CLOUD_TOKEN:-}
  # Minutes between automatic syncs (at least 5); empty syncs only when you press Sync now in Settings.
  SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-}
  # Narrow the synced projects (comma-separated); empty syncs every selected project.
  SYNC_PROJECTS: ${SYNC_PROJECTS:-}
  # true: proposed lessons are sent too, as suggestions for an org admin; default only approved ones.
  SYNC_SUGGESTIONS: ${SYNC_SUGGESTIONS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  neo4j:
    # 5.26 is the long-term-support line: patch updates only.
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7476}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7689}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    init: true # reaps the CLI agents' child processes and forwards SIGTERM for a clean shutdown
    stop_grace_period: 30s
    environment:
      <<: *env
      TRANSCRIPTS_DIR: /transcripts
      CODEX_SESSIONS_DIR: /codex-sessions
      CLASSIFY_LLM: ${CLASSIFY_LLM:-}
      POSTMORTEM_LLM: ${POSTMORTEM_LLM:-}
      # codex-cli can read everything this container can (SECURITY.md); it runs only with ALLOW_UNCONFINED_CODEX=1.
      ALLOW_UNCONFINED_CODEX: ${ALLOW_UNCONFINED_CODEX:-}
      SCAN_LLM: ${SCAN_LLM:-}
      CODEX_HOME: /codex
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # project-key=owner/repo pairs whose PR discussions become context, e.g. demo-shop=me/demo-shop
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      GITHUB_SYNC_HOURS: ${GITHUB_SYNC_HOURS:-6}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      # TypeSafe Jev: set CLASSIFY_LLM=jev to classify pushback with it (classification only)
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Days to keep the text of turns nobody flagged; empty keeps everything.
      TURN_RETENTION_DAYS: ${TURN_RETENTION_DAYS:-}
      # true: Claude Code feedback memories become approved lessons on import; default false (proposed, you approve them).
      MEMORY_AUTO_APPROVE: ${MEMORY_AUTO_APPROVE:-false}
      STATE_DB: /state/worker.sqlite
      POLL_SECONDS: ${POLL_SECONDS:-30}
      # Empty = the defaults (50 turns per cycle; 400 files, 80000 bytes per file for the code map and scans).
      CLASSIFY_BATCH: ${CLASSIFY_BATCH:-}
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-}
      SCAN_MAX_BYTES: ${SCAN_MAX_BYTES:-}
    volumes:
      - ${HOME}/.claude/projects:/transcripts:ro
      # Codex CLI / Desktop session transcripts. Read only for the folders you select.
      - ${CODEX_SESSIONS_DIR:-${HOME}/.codex/sessions}:/codex-sessions:ro
      - ${PROJECTS_DIR:-${HOME}/code}:/vibe:ro
      - ${FEEDBACK_TOOL_DIR:-${PWD}}/examples:/examples:ro
      # Only the Codex login, not all of ~/.codex (config, history, other sessions). Writable so token refreshes stick.
      - codex-home:/codex
      # CODEX_AUTH_FILE=~/.codex/auth.json (set by scripts/setup.sh when you use Codex); the default is an empty placeholder.
      - ${CODEX_AUTH_FILE:-./state/codex-auth.json}:/codex/auth.json
      - ./state:/state
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      neo4j: { condition: service_healthy }
      # Only with --profile postgres; without it this dependency is skipped.
      postgres: { condition: service_healthy, required: false }
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    init: true
    environment:
      <<: *env
      CHECK_LLM: ${CHECK_LLM:-}
      # Set API_TOKEN (24+ chars, e.g. openssl rand -hex 24) before exposing the API beyond this machine.
      API_TOKEN: ${API_TOKEN:-}
      PUBLIC_HOSTS: ${PUBLIC_HOSTS:-}
      # The address the port is published on (below); anything but loopback without API_TOKEN stops the API at start.
      API_BIND: ${API_BIND:-127.0.0.1}
      # Inside the container the server listens on every interface; the publish above decides who can reach it.
      API_LISTEN: 0.0.0.0
    volumes:
      - ${PROJECTS_DIR:-${HOME}/code}:/vibe:ro
      - ${FEEDBACK_TOOL_DIR:-${PWD}}/examples:/examples:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      # Loopback only by default. API_BIND=0.0.0.0 requires API_TOKEN (the API refuses to start without it) and
      # PUBLIC_HOSTS for the names clients use.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8787}:8787"
    depends_on:
      neo4j: { condition: service_healthy }
      # Only with --profile postgres; without it this dependency is skipped.
      postgres: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # The Postgres backend (pgvector on Postgres 17), for STORE=postgres. Off unless you ask for it:
  #   STORE=postgres docker compose --profile postgres up -d
  # Back it up with pg_dump (docs/operations.md). Needs POSTGRES_PASSWORD in .env (letters and digits: it goes in a URL).
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: fg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: feedback
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fg -d feedback"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Free, fully containerised model server (CPU on macOS, GPU on Linux with the nvidia runtime).
  # Use with: docker compose --profile ollama up -d  and  OLLAMA_URL=http://ollama:11434
  ollama:
    image: ollama/ollama:0.40.2
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"

volumes:
  neo4j-data:
  postgres-data:
  ollama-models:
  codex-home:
