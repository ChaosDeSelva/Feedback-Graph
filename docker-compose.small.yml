# Opt-in for a small pilot: add this file to COMPOSE_FILE alongside project mounts.
services:
  neo4j:
    # 1 GiB left no native/JVM headroom even on a ten-file install. This is still half the default budget.
    mem_limit: 1536M
    environment:
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 128M
      NEO4J_dbms_memory_transaction_total_max: 128M
      NEO4J_db_memory_transaction_total_max: 128M
      NEO4J_db_memory_transaction_max: 32M
