<g><rect x="24" y="104" width="264" height="72" rx="10" class="fga-plain" stroke-width="1.5"/>
<text x="156" y="134" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Sessions and reviews</text>
<text x="156" y="158" text-anchor="middle" class="fga-s" font-size="14">Claude Code, Codex, GitHub, Linear</text></g>
<g><rect x="328" y="104" width="264" height="72" rx="10" class="fga-plain" stroke-width="1.5"/>
<text x="460" y="134" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Flag pushback</text>
<text x="460" y="158" text-anchor="middle" class="fga-s" font-size="14">“that’s not right”, “you missed X”</text></g>
<g><rect x="632" y="104" width="264" height="72" rx="10" class="fga-you" stroke-width="1.5"/>
<text x="764" y="134" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Inbox</text>
<text x="764" y="158" text-anchor="middle" class="fga-s" font-size="14">you confirm it was a real miss</text></g>
<g><rect x="936" y="104" width="264" height="72" rx="10" class="fga-plain" stroke-width="1.5"/>
<text x="1068" y="134" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Post-mortem</text>
<text x="1068" y="158" text-anchor="middle" class="fga-s" font-size="14">the miss, its cause, a lesson</text></g>
<g><rect x="24" y="244" width="568" height="72" rx="10" class="fga-plain" stroke-width="1.5"/>
<text x="308" y="274" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Calls and notes</text>
<text x="308" y="298" text-anchor="middle" class="fga-s" font-size="14">intake, opt-in: read into claims, questions and people</text></g>
<g><rect x="632" y="244" width="264" height="72" rx="10" class="fga-you" stroke-width="1.5"/>
<text x="764" y="274" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Claims</text>
<text x="764" y="298" text-anchor="middle" class="fga-s" font-size="14">you accept who said what, when</text></g>
<g><rect x="936" y="244" width="264" height="72" rx="10" class="fga-you" stroke-width="1.5"/>
<text x="1068" y="274" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Lessons</text>
<text x="1068" y="298" text-anchor="middle" class="fga-s" font-size="14">you approve, or the loop once earned</text></g>
<g><rect x="24" y="384" width="264" height="72" rx="10" class="fga-plain" stroke-width="1.5"/>
<text x="156" y="414" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Your code</text>
<text x="156" y="438" text-anchor="middle" class="fga-s" font-size="14">the project folders you choose</text></g>
<g><rect x="328" y="384" width="264" height="72" rx="10" class="fga-plain" stroke-width="1.5"/>
<text x="460" y="414" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Code map</text>
<text x="460" y="438" text-anchor="middle" class="fga-s" font-size="14">files, imports, tests, hotspots</text></g>
<g><rect x="632" y="384" width="264" height="72" rx="10" class="fga-plain" stroke-width="1.5"/>
<text x="764" y="414" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Facts and docs</text>
<text x="764" y="438" text-anchor="middle" class="fga-s" font-size="14">accepted claims, uploads, READMEs</text></g>
<g><rect x="24" y="524" width="264" height="84" rx="10" class="fga-loop" stroke-width="1.5"/>
<text x="156" y="560" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Learning loop</text>
<text x="156" y="584" text-anchor="middle" class="fga-s" font-size="14">reads outcomes, decides, applies</text></g>
<g><rect x="328" y="524" width="872" height="84" rx="10" class="fga-graph" stroke-width="1.5"/>
<text x="764" y="560" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">The graph: Neo4j or Postgres, read by every page</text>
<text x="764" y="584" text-anchor="middle" class="fga-s" font-size="14">feedback · misses · causes · lessons · facts · claims · conflicts · code map · decisions · activity</text></g>
<g><rect x="24" y="676" width="264" height="72" rx="10" class="fga-you" stroke-width="1.5"/>
<text x="156" y="706" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Decisions</text>
<text x="156" y="730" text-anchor="middle" class="fga-s" font-size="14">you keep, roll back or add a note</text></g>
<g><rect x="328" y="676" width="264" height="72" rx="10" class="fga-you" stroke-width="1.5"/>
<text x="460" y="706" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Conflicts</text>
<text x="460" y="730" text-anchor="middle" class="fga-s" font-size="14">you settle; disputed until then</text></g>
<g><rect x="632" y="676" width="264" height="72" rx="10" class="fga-agent" stroke-width="1.5"/>
<text x="764" y="706" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Before work</text>
<text x="764" y="730" text-anchor="middle" class="fga-s" font-size="14">get_task_context: lessons and code</text></g>
<g><rect x="936" y="676" width="264" height="72" rx="10" class="fga-agent" stroke-width="1.5"/>
<text x="1068" y="706" text-anchor="middle" class="fga-t" font-size="19" font-weight="600">Before “done”</text>
<text x="1068" y="730" text-anchor="middle" class="fga-s" font-size="14">check_before_done judges the diff</text></g>
<text x="620" y="38" text-anchor="middle" class="fga-s" font-size="15" font-style="italic">Agents read approved lessons before they start, and check against them before they say “done”</text>
<text x="108" y="647" text-anchor="end" class="fga-s" font-size="15" font-style="italic">records</text>
<text x="204" y="647" text-anchor="start" class="fga-s" font-size="15" font-style="italic">your calls tune it</text>
<rect x="24" y="785" width="16" height="16" rx="3" class="fga-you" stroke-width="1.5"/>
<text x="48" y="798" class="fga-s" font-size="15">you decide</text>
<rect x="164" y="785" width="16" height="16" rx="3" class="fga-graph" stroke-width="1.5"/>
<text x="188" y="798" class="fga-s" font-size="15">stored</text>
<rect x="273.6" y="785" width="16" height="16" rx="3" class="fga-loop" stroke-width="1.5"/>
<text x="297.6" y="798" class="fga-s" font-size="15">learns on its own, every change audited</text>
<rect x="634" y="785" width="16" height="16" rx="3" class="fga-agent" stroke-width="1.5"/>
<text x="658" y="798" class="fga-s" font-size="15">what agents get (MCP)</text>
</svg>
