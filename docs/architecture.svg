<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" role="img" aria-labelledby="fga-title fga-desc" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="fga-title">How Feedback Graph works</title>
<desc id="fga-desc">Sessions and reviews flow through pushback flagging, your Inbox and a post-mortem into lessons that you approve (or the learning loop, once your reviews have earned it), alongside the code map and facts, all stored in one graph. Agents get approved lessons before work and a check before done. The learning loop reads outcomes from the graph, records each decision for you to keep or roll back, and your calls tune it.</desc>
<style>.fga-bg{fill:#f2f1ec}.fga-t{fill:#1d1e20}.fga-s{fill:#66675f}.fga-a{stroke:#8a897f;fill:none}.fga-h{fill:#8a897f}.fga-plain{fill:#ffffff;stroke:#cbc8bd}.fga-you{fill:#fdf2d3;stroke:#c58a00}.fga-graph{fill:#e3ecfb;stroke:#2f6bd8}.fga-loop{fill:#eee7fb;stroke:#7c4ddb}.fga-agent{fill:#e2f3e8;stroke:#1f9d55}@media (prefers-color-scheme: dark){.fga-bg{fill:#161615}.fga-t{fill:#ecebe5}.fga-s{fill:#a3a299}.fga-a{stroke:#77766f;fill:none}.fga-h{fill:#77766f}.fga-plain{fill:#1e1e1c;stroke:#43433f}.fga-you{fill:#2f2814;stroke:#a87400}.fga-graph{fill:#172642;stroke:#4f84e6}.fga-loop{fill:#2a2140;stroke:#9b7cf0}.fga-agent{fill:#16301f;stroke:#34ad69}}</style>
